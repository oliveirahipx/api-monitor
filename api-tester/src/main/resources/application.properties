spring.application.name=api-tester

# Banco de dados PostgreSQL (os padrões batem com o docker-compose.yml da raiz do repositório)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/BD_Test-API}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate (JPA)
# update: cria/atualiza as tabelas a partir das entidades ao iniciar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
